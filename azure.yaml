# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: budget
services:
  budget:
    language: dotnet
    project: ./Budget.AppHost/Budget.AppHost.csproj
    host: containerapp

  bacpac-function:
    language: dotnet
    project: ./Budget.Functions/Budget.Functions.csproj
    host: function
    resourceName: BACPAC_FUNCTION_APP_NAME

hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./hooks/postdeploy.ps1
    posix:
      shell: sh
      run: ./hooks/postdeploy.sh
