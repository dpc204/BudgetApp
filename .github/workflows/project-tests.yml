name: Run Project Tests

on:
  push:
    branches:
      - '**'


jobs:
test:
  name: Build and Test
  runs-on: ubuntu-latest
    
  services:
    sqlserver:
      image: mcr.microsoft.com/mssql/server:2022-latest
      env:
        ACCEPT_EULA: Y
        SA_PASSWORD: YourStrong!Passw0rd
        MSSQL_PID: Developer
      ports:
        - 1433:1433
      options: >-
        --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong!Passw0rd -C -Q 'SELECT 1' || exit 1"
        --health-interval 10s
        --health-timeout 5s
        --health-retries 5
    
  steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Build solution
        run: dotnet build --no-restore --configuration Release
        
      - name: Run tests
        env:
          BudgetConnection: "Server=localhost,1433;Database=BudgetDB_Test;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
          LocalBudgetConnection: "Server=localhost,1433;Database=BudgetDB_Test;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults
        continue-on-error: true
        
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Test Results
          path: './TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: true
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/*.trx
          retention-days: 30
